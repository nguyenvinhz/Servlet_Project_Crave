name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact-name:
        description: Tested WAR artifact from this workflow run
        value: ${{ jobs.build-test.outputs.artifact-name }}
      war-sha256:
        description: SHA-256 of the WAR that passed all checks
        value: ${{ jobs.build-test.outputs.war-sha256 }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: crave-war
      war-sha256: ${{ steps.war-digest.outputs.sha256 }}
    env:
      TZ: Asia/Ho_Chi_Minh
      DB_USER: root
      # This credential belongs only to the temporary CI database.
      DB_PASSWORD: ci-root-password
    services:
      mysql:
        image: mysql:8.4
        env:
          TZ: Asia/Ho_Chi_Minh
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
          overwrite-settings: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Initialize isolated CI database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --user=root --default-character-set=utf8mb4 < database/schema.sql
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --user=root --default-character-set=utf8mb4 < database/seed.sql
          printf 'DB_URL=jdbc:mysql://127.0.0.1:%s/crave?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8\n' \
            "$MYSQL_PORT" >> "$GITHUB_ENV"

      - name: Verify repeatable production migrations in the disposable database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          for pass in 1 2; do
            cat database/migrations/2026-10-13-payos-payment.sql \
              database/migrations/2026-10-13-email-verification.sql \
              database/migrations/2026-10-15-delivery-location.sql | \
              docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
                mysql --user=root --default-character-set=utf8mb4 --database=crave
          done

      - name: Build WAR and run all backend tests
        run: mvn --batch-mode --no-transfer-progress -Pdev clean verify

      - name: Run cart and promotion assertions
        run: |
          mvn --batch-mode --no-transfer-progress -Pdev \
            org.apache.maven.plugins:maven-dependency-plugin:3.10.0:build-classpath \
            -DincludeScope=test -Dmdep.outputFile=target/test-classpath.txt
          java -ea -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" \
            vn.edu.crave.model.service.CartPromotionServiceTest

      - name: Check frontend JavaScript syntax
        run: |
          find src/main/webapp/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check tests/frontend/servlet-form-browser-smoke.cjs
          node --check tests/frontend/delivery-map-browser-smoke.cjs
          node --check tests/runtime/http-smoke.cjs
          node --check tests/runtime/smtp-fixture.cjs

      - name: Verify deployment and rollback script
        run: |
          bash -n scripts/deploy-ec2.sh tests/scripts/deploy-ec2-test.sh
          bash tests/scripts/deploy-ec2-test.sh
          python3 tests/scripts/register-payos-webhook-test.py

      - name: Run packaged WAR form and browser smoke tests
        env:
          CRAVE_SMOKE_BASE_URL: http://127.0.0.1:8081/crave
          CRAVE_SMOKE_ADMIN_EMAIL: ci-runtime@crave.example
          CRAVE_SMOKE_INBOX_URL: http://127.0.0.1:2526
          EMAIL_SMTP_HOST: 127.0.0.1
          EMAIL_SMTP_PORT: '2525'
          EMAIL_SMTP_USERNAME: ''
          EMAIL_SMTP_PASSWORD: ''
          EMAIL_FROM: ci-mail@crave.example
          EMAIL_SMTP_STARTTLS: 'false'
          EMAIL_OTP_SECRET: ci-only-disposable-otp-secret-at-least-32-characters
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -Pdev \
            org.apache.maven.plugins:maven-dependency-plugin:3.10.0:build-classpath \
            -DincludeScope=test \
            -DincludeGroupIds=org.apache.tomcat.embed,org.apache.tomcat,org.eclipse.jdt \
            -Dmdep.outputFile=target/dev-classpath.txt

          # Only this job's disposable database receives this generated admin account.
          export CRAVE_ADMIN_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          printf '::add-mask::%s\n' "$CRAVE_ADMIN_PASSWORD"
          export CRAVE_SMOKE_ADMIN_PASSWORD="$CRAVE_ADMIN_PASSWORD"
          java -Dfile.encoding=UTF-8 \
            -cp "target/test-classes:target/classes:$(cat target/test-classpath.txt)" \
            vn.edu.crave.util.CreateEmployee "$CRAVE_SMOKE_ADMIN_EMAIL" "CI Runtime Admin" "0999285721" ADMIN

          jar tf target/crave.war > target/war-entries.txt
          if grep -Eq '^WEB-INF/(classes/vn/edu/crave/util/DevServer|lib/tomcat-embed-)' target/war-entries.txt; then
            echo 'Development launcher or embedded Tomcat leaked into the production WAR.' >&2
            exit 1
          fi

          server_pid=''
          smtp_pid=''
          runtime_log='target/runtime-smoke-tomcat.log'
          health_file='target/runtime-health.txt'
          cleanup() {
            if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" || true
              wait "$server_pid" || true
            fi
            if [[ -n "$smtp_pid" ]] && kill -0 "$smtp_pid" 2>/dev/null; then
              kill "$smtp_pid" || true
              wait "$smtp_pid" || true
            fi
          }
          trap cleanup EXIT
          node tests/runtime/smtp-fixture.cjs > target/runtime-smoke-smtp.log 2>&1 &
          smtp_pid=$!
          inbox_ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 1 "$CRAVE_SMOKE_INBOX_URL/health" > /dev/null; then
              inbox_ready=1
              break
            fi
            sleep 1
          done
          [[ "$inbox_ready" == 1 ]] || { echo 'The local SMTP fixture did not become ready.' >&2; exit 1; }
          java -Dfile.encoding=UTF-8 \
            -cp "target/test-classes:$(cat target/dev-classpath.txt)" \
            vn.edu.crave.util.DevServer target/crave.war 8081 > "$runtime_log" 2>&1 &
          server_pid=$!

          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$runtime_log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 "$CRAVE_SMOKE_BASE_URL/health" > "$health_file" \
              && node -e "const p=require('node:fs').readFileSync(process.argv[1],'utf8').trim().split(String.fromCharCode(10)).map(x=>x.trim()).join('|');process.exit(p==='application=UP|database=UP' ? 0 : 1)" "$health_file"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$runtime_log"
            echo 'The packaged WAR did not become healthy.' >&2
            exit 1
          fi
          node tests/runtime/http-smoke.cjs
          export CHROME_PATH="$(command -v google-chrome)"
          "$CHROME_PATH" --version
          node tests/frontend/servlet-form-browser-smoke.cjs
          node tests/frontend/delivery-map-browser-smoke.cjs

      - name: Record tested WAR checksum
        id: war-digest
        working-directory: target
        run: |
          sha256sum crave.war > crave.war.sha256
          printf 'sha256=%s\n' "$(cut -d ' ' -f 1 crave.war.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload tested WAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crave-war
          path: |
            target/crave.war
            target/crave.war.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload runtime smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-smoke-diagnostics
          path: |
            target/runtime-smoke-tomcat.log
            target/runtime-smoke-smtp.log
            target/runtime-health.txt
            .runtime/form-browser/*.png
            .runtime/map-browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show MySQL logs on failure
        if: failure()
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: docker logs "$MYSQL_CONTAINER_ID"
