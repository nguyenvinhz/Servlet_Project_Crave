name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact-name:
        description: Tested WAR artifact from this workflow run
        value: ${{ jobs.build-test.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: crave-war
    env:
      TZ: Asia/Ho_Chi_Minh
      DB_USER: root
      # This credential belongs only to the temporary CI database.
      DB_PASSWORD: ci-root-password
    services:
      mysql:
        image: mysql:8.4
        env:
          TZ: Asia/Ho_Chi_Minh
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
          overwrite-settings: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Initialize isolated CI database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --user=root --default-character-set=utf8mb4 < database/schema.sql
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --user=root --default-character-set=utf8mb4 < database/seed.sql
          printf 'DB_URL=jdbc:mysql://127.0.0.1:%s/crave?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8\n' \
            "$MYSQL_PORT" >> "$GITHUB_ENV"

      - name: Build WAR and run all backend tests
        run: mvn --batch-mode --no-transfer-progress --file backend/pom.xml clean verify

      - name: Run cart and promotion assertions
        run: |
          mvn --batch-mode --no-transfer-progress --file backend/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.10.0:build-classpath \
            -DincludeScope=test -Dmdep.outputFile=target/test-classpath.txt
          java -ea -cp "backend/target/test-classes:backend/target/classes:$(cat backend/target/test-classpath.txt)" \
            com.foodordering.CartPromotionServiceTest

      - name: Check frontend JavaScript syntax
        run: |
          find frontend/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check frontend/tests/account-browser-smoke.cjs

      - name: Verify deployment and rollback script
        run: bash scripts/tests/deploy-ec2-test.sh

      - name: Run browser smoke tests
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          "$CHROME_PATH" --version
          node frontend/tests/account-browser-smoke.cjs

      - name: Upload tested WAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crave-war
          path: backend/target/crave.war
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show MySQL logs on failure
        if: failure()
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: docker logs "$MYSQL_CONTAINER_ID"
