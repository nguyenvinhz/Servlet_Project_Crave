name: CI/CD - main to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Serialize production releases, including manual runs from main.
concurrency:
  group: crave-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy EC2
    if: github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    needs: ci
    # Only trusted main deployments use the production runner. PR CI is hosted.
    runs-on: [self-hosted, linux, x64, crave-production]
    environment: production
    timeout-minutes: 15
    env:
      DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/crave' }}
      COMPOSE_FILE: ${{ vars.EC2_COMPOSE_FILE || 'compose.yaml' }}
      APP_SERVICE: ${{ vars.EC2_APP_SERVICE || 'app' }}
      DB_SERVICE: ${{ vars.EC2_DB_SERVICE || 'mysql' }}
      HEALTH_URL: ${{ vars.EC2_HEALTH_URL || 'http://127.0.0.1:8080/crave/health' }}
      PAYOS_PUBLIC_BASE_URL: ${{ vars.PAYOS_PUBLIC_BASE_URL }}
      EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
      EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
      EMAIL_SMTP_USERNAME: ${{ vars.EMAIL_SMTP_USERNAME || 'craveshopvn@gmail.com' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || 'craveshopvn@gmail.com' }}
      EMAIL_SMTP_STARTTLS: 'true'
      CRAVE_STORE_ADDRESS: ${{ vars.CRAVE_STORE_ADDRESS }}
      CRAVE_STORE_LATITUDE: ${{ vars.CRAVE_STORE_LATITUDE }}
      CRAVE_STORE_LONGITUDE: ${{ vars.CRAVE_STORE_LONGITUDE }}
      CRAVE_GEOCODER_URL: ${{ vars.CRAVE_GEOCODER_URL || 'https://photon.komoot.io/api/' }}

    steps:
      - name: Kiểm tra runner production
        run: |
          if [[ "$RUNNER_NAME" != 'crave-ec2' ]]; then
            printf 'CD yêu cầu runner crave-ec2, runner hiện tại: %s\n' "$RUNNER_NAME" >&2
            exit 1
          fi

      - name: Checkout deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the WAR that passed CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: ${{ runner.temp }}/crave-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy and check application health
        id: deploy_application
        env:
          WAR_SOURCE: ${{ runner.temp }}/crave-release-${{ github.run_id }}-${{ github.run_attempt }}/crave.war
          EXPECTED_WAR_SHA256: ${{ needs.ci.outputs.war-sha256 }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_OTP_SECRET: ${{ secrets.EMAIL_OTP_SECRET }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WAR_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'CI did not provide a valid WAR checksum.' >&2; exit 1; }
          actual_sha256=$(sha256sum "$WAR_SOURCE")
          [[ "${actual_sha256%% *}" == "$EXPECTED_WAR_SHA256" ]] || { echo 'Downloaded WAR does not match the tested artifact.' >&2; exit 1; }
          bash scripts/deploy-ec2.sh "$WAR_SOURCE"

      - name: Register payOS webhook for the public application
        id: payos_webhook
        env:
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
        run: python3 scripts/register-payos-webhook.py

      - name: Record deployment
        if: ${{ !cancelled() && steps.deploy_application.outcome == 'success' }}
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_WAR_SHA256: ${{ needs.ci.outputs.war-sha256 }}
          PAYOS_WEBHOOK_OUTCOME: ${{ steps.payos_webhook.outcome }}
        run: |
          printf 'Deployed commit `%s` to EC2. Application health check passed.\n' "$DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Tested WAR SHA-256: `%s`\n' "$DEPLOY_WAR_SHA256" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PAYOS_WEBHOOK_OUTCOME" == 'success' ]]; then
            printf 'payOS webhook configured.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'payOS webhook was not confirmed. The deployed application is still running; check the webhook registration step for the failure category.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
