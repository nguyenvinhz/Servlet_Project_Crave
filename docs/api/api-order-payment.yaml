openapi: 3.0.3
info:
  title: Crave - Order & Payment API
  version: 1.1.0
  description: |
    API quản lý đơn hàng và thanh toán.
    Tích hợp với module Cart (của Trí) để lấy dữ liệu giỏ hàng, và module Auth (của Vinh) để lấy Customer.
servers:
  - url: /crave/api

paths:
  /orders:
    post:
      summary: Tạo đơn hàng mới từ giỏ hàng hiện tại (Checkout)
      description: |
        Server đọc lại giá món, tùy chọn và subtotal từ giỏ hàng trong transaction.
        Voucher được kiểm tra lại trạng thái, thời gian hiệu lực và giá trị tối thiểu
        tại thời điểm tạo đơn. Client chỉ gửi promotionId, không gửi tổng tiền hoặc
        số tiền giảm. Giỏ được xóa sau khi tạo đơn thành công; request lặp trên giỏ
        đã checkout trả CART_EMPTY và không tạo thêm đơn.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Tạo đơn hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrderResponse'
        '400':
          description: |
            Dữ liệu không hợp lệ; CART_EMPTY, FOOD_NOT_AVAILABLE, INVALID_OPTION;
            PROMOTION_NOT_FOUND, PROMOTION_INACTIVE, PROMOTION_NOT_STARTED,
            PROMOTION_EXPIRED hoặc PROMOTION_MIN_ORDER_NOT_MET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

    get:
      summary: Xem lịch sử đơn hàng của khách hàng hiện tại
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Danh sách đơn hàng (sắp xếp giảm dần theo thời gian)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ListOrderResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /orders/{orderId}:
    get:
      summary: Xem chi tiết một đơn hàng
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Thông tin chi tiết đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrderDetailResponse'
        '403':
          description: Không có quyền truy cập đơn hàng của người khác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '404':
          description: Không tìm thấy đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /admin/orders:
    get:
      summary: Lấy danh sách tất cả đơn hàng (Dành cho Admin)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Danh sách đơn hàng cho admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ListOrderResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '403':
          description: Không có quyền (Chỉ dành cho ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /admin/orders/{orderId}/status:
    patch:
      summary: Cập nhật trạng thái đơn hàng (Dành cho Nhân viên)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Trạng thái chuyển không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '403':
          description: Không có quyền (Chỉ dành cho ADMIN / ORDER_STAFF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /payments/payos/orders/{orderId}/link:
    post:
      summary: Tạo hoặc mở lại QR chuyển khoản PayOS của đơn hàng
      description: |
        Chỉ khách hàng sở hữu đơn BANK_TRANSFER được gọi. Server lấy số tiền từ
        payment.amount và lưu mã PayOS trước khi gọi cổng thanh toán; client không
        cung cấp customerId, amount hay trạng thái thanh toán. Không cần request body.
        Request lặp dùng cùng mã đã lưu. Liên kết đã hủy/hết hạn chỉ được tạo lại
        sau khi API PayOS xác nhận chưa nhận tiền; không tạo lại liên kết có tiền
        chuyển một phần. Đơn đã hủy, đã thanh toán hoặc hoàn tiền bị từ chối.
        Nếu PayOS lỗi sau khi checkout, đơn vẫn tồn tại; client chuyển đến chi tiết
        đơn để thử thanh toán lại, không gửi lại POST /orders.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PayosOrderId'
      responses:
        '200':
          description: Liên kết PayOS đang chờ thanh toán; chuyển trình duyệt đến checkoutUrl
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PayosCheckoutLink'
        '400':
          $ref: '#/components/responses/PayosBadRequest'
        '401':
          $ref: '#/components/responses/PayosUnauthenticated'
        '403':
          $ref: '#/components/responses/PayosForbidden'
        '404':
          $ref: '#/components/responses/PayosOrderNotFound'
        '502':
          $ref: '#/components/responses/PayosUnavailable'
        '503':
          $ref: '#/components/responses/PayosNotConfigured'

  /payments/payos/orders/{orderId}/sync:
    post:
      summary: Đối soát thanh toán với API PayOS khi khách quay lại cửa hàng
      description: |
        Chỉ khách hàng sở hữu đơn BANK_TRANSFER được gọi; không cần request body.
        Server kiểm tra mã đơn PayOS, mã liên kết và số tiền đặt thanh toán rồi chỉ
        ghi SUCCESS khi API PayOS trả PAID với amountPaid >= payment.amount.
        Tổng tiền gốc của đơn không thay đổi khi có giao dịch chuyển dư.
        Các tham số status, cancel, code hoặc orderCode trên URL trả về không phải
        bằng chứng thanh toán. Chuyển từng phần chưa đủ tiền vẫn trả PENDING.
        Nếu chưa tạo mã PayOS, trả trạng thái thanh toán hiện tại. SUCCESS và
        REFUNDED giữ nguyên thời điểm thanh toán/mã giao dịch khi đối soát lặp.
        Không ghi SUCCESS cho đơn đã hủy; cần cửa hàng đối soát trường hợp này.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PayosOrderId'
      responses:
        '200':
          description: Trạng thái thanh toán lưu trong cửa hàng sau khi đối soát
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PayosPaymentResult'
        '400':
          $ref: '#/components/responses/PayosBadRequest'
        '401':
          $ref: '#/components/responses/PayosUnauthenticated'
        '403':
          $ref: '#/components/responses/PayosForbidden'
        '404':
          $ref: '#/components/responses/PayosOrderNotFound'
        '502':
          $ref: '#/components/responses/PayosUnavailable'
        '503':
          $ref: '#/components/responses/PayosNotConfigured'

  /payments/payos/webhook:
    post:
      summary: Nhận giao dịch ngân hàng đã ký từ PayOS
      description: |
        Chỉ POST đúng đường dẫn này được miễn cookie phiên và kiểm tra Origin.
        Server bắt buộc xác minh signature HMAC-SHA256 của toàn bộ object data
        bằng checksum key phía máy chủ; giới hạn body 65.536 byte kể cả chunked.
        Server kiểm tra currency VND, mã đơn, mã liên kết, số tiền và reference.
        Với chuyển từng phần/chuyển dư, API PayOS phải xác nhận đúng số tiền gốc
        của đơn, đúng liên kết và số tiền đã nhận; chỉ PAID đủ tiền mới ghi SUCCESS.
        Webhook lặp không thay đổi thời điểm thanh toán hay mã giao dịch ban đầu.
        Webhook có chữ ký đúng nhưng báo thất bại hoặc mẫu kiểm tra không có đơn
        tương ứng được trả 200 mà không sửa thanh toán. Chữ ký sai luôn trả 400.
        Không tự ghi SUCCESS cho đơn đã hủy hoặc thay đổi thanh toán đã hoàn tiền.
        Quy tắc chữ ký: https://payos.vn/docs/tich-hop-webhook/kiem-tra-du-lieu-voi-signature/
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayosWebhook'
      responses:
        '200':
          description: Đã nhận webhook hợp lệ, bao gồm thông báo chưa đủ tiền và mẫu kiểm tra
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PayosWebhookAcknowledgement'
        '400':
          description: INVALID_REQUEST, PAYOS_INVALID_SIGNATURE, PAYOS_INVALID_PAYMENT, PAYOS_PAYMENT_MISMATCH hoặc BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '502':
          $ref: '#/components/responses/PayosUnavailable'
        '503':
          $ref: '#/components/responses/PayosNotConfigured'

  /admin/payments/{paymentId}/status:
    patch:
      summary: Cập nhật trạng thái thanh toán
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '403':
          description: Không có quyền truy cập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

components:
  parameters:
    PayosOrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 10
        pattern: '^[A-Za-z0-9]{1,10}$'
      example: DH01

  responses:
    PayosBadRequest:
      description: |
        INVALID_REQUEST nếu đường dẫn/JSON không hợp lệ; BAD_REQUEST nếu đơn không
        dùng BANK_TRANSFER, số tiền không hợp lệ, đơn đã hủy/đã thanh toán/hoàn tiền
        hoặc liên kết đóng cần đối soát. PAYOS_PAYMENT_MISMATCH nếu mã đơn, số tiền
        hoặc mã liên kết không khớp; PAYOS_INVALID_PAYMENT nếu dữ liệu cổng không hợp lệ.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse_Error' }
    PayosUnauthenticated:
      description: UNAUTHORIZED — chưa đăng nhập hoặc phiên đăng nhập đã hết hạn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse_Error' }
    PayosForbidden:
      description: FORBIDDEN — tài khoản không phải khách hàng, không sở hữu đơn hoặc Origin không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse_Error' }
    PayosOrderNotFound:
      description: NOT_FOUND — đơn hàng không tồn tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse_Error' }
    PayosUnavailable:
      description: PAYOS_UNAVAILABLE — kết nối PayOS lỗi hoặc phản hồi không có chữ ký hợp lệ; đơn vẫn tồn tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse_Error' }
    PayosNotConfigured:
      description: PAYOS_NOT_CONFIGURED, PAYOS_RATE_LIMITED hoặc SERVICE_UNAVAILABLE — cấu hình thiếu, PayOS giới hạn lượt yêu cầu hoặc dịch vụ tài khoản chưa sẵn sàng; đơn đã tạo vẫn được giữ
      headers:
        Retry-After:
          description: Khi PAYOS_RATE_LIMITED, số giây nên chờ trước khi thử lại; server không tự gửi lại giao dịch
          schema: { type: integer, minimum: 1, maximum: 60, example: 5 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse_Error' }

  schemas:
    PayosCheckoutLink:
      type: object
      required: [orderId, checkoutUrl]
      properties:
        orderId: { type: string, example: DH01 }
        checkoutUrl:
          type: string
          format: uri
          description: Liên kết HTTPS trên pay.payos.vn; không chứa khóa cấu hình của cửa hàng
          example: https://pay.payos.vn/web/124c33293c43417ab7879e14c8d9eb18
    PayosPaymentResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
          example: PENDING
    PayosWebhook:
      type: object
      required: [code, success, data, signature]
      properties:
        code: { type: string, example: '00' }
        desc: { type: string, example: success }
        success: { type: boolean, example: true }
        signature:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: HMAC-SHA256 của toàn bộ data; checksum key không gửi trong body
        data:
          type: object
          additionalProperties: true
          required: [orderCode, amount, currency, paymentLinkId, reference, code]
          properties:
            orderCode: { type: integer, format: int64, minimum: 0, example: 123 }
            amount: { type: integer, format: int64, minimum: 0, example: 3000 }
            currency: { type: string, enum: [VND] }
            paymentLinkId: { type: string, maxLength: 100, example: 124c33293c43417ab7879e14c8d9eb18 }
            reference: { type: string, maxLength: 100, example: TF230204212323 }
            code: { type: string, example: '00' }
            desc: { type: string, example: Thành công }
            description: { type: string, example: VQRIO123 }
            accountNumber: { type: string, example: '12345678' }
            transactionDateTime: { type: string, example: '2023-02-04 18:25:00' }
    ApiResponse_PayosCheckoutLink:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/PayosCheckoutLink' }
        error:
          allOf: [{ $ref: '#/components/schemas/ApiError' }]
          nullable: true
    ApiResponse_PayosPaymentResult:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/PayosPaymentResult' }
        error:
          allOf: [{ $ref: '#/components/schemas/ApiError' }]
          nullable: true
    ApiResponse_PayosWebhookAcknowledgement:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, example: true }
        data: { type: string, example: Đã nhận thông tin thanh toán. }
        error:
          allOf: [{ $ref: '#/components/schemas/ApiError' }]
          nullable: true

    CreateOrderRequest:
      type: object
      required:
        - fulfillmentType
        - receiverName
        - receiverPhone
        - paymentMethod
      properties:
        fulfillmentType:
          type: string
          enum: [DELIVERY, PICKUP]
        receiverName:
          type: string
        receiverPhone:
          type: string
        deliveryAddress:
          type: string
          description: "Bắt buộc nếu fulfillmentType là DELIVERY"
        customerNote:
          type: string
        promotionId:
          type: string
        paymentMethod:
          type: string
          enum: [CASH, BANK_TRANSFER, E_WALLET]

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING_CONFIRMATION, PREPARING, DELIVERING, COMPLETED, CANCELLED]
        note:
          type: string

    UpdatePaymentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED, REFUNDED]
        transactionRef:
          type: string

    # --- Responses ---
    ApiResponse_OrderResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/OrderResponse' }
        error: { $ref: '#/components/schemas/ApiError' }

    ApiResponse_ListOrderResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/OrderSummaryResponse' }
        error: { $ref: '#/components/schemas/ApiError' }

    ApiResponse_OrderDetailResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/OrderResponse' }
        error: { $ref: '#/components/schemas/ApiError' }

    ApiResponse_Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true }
        error: { $ref: '#/components/schemas/ApiError' }

    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    OrderSummaryResponse:
      type: object
      properties:
        orderId: { type: string }
        orderedAt: { type: string, format: date-time }
        fulfillmentType: { type: string }
        totalAmount: { type: number }
        status: { type: string }
        paymentStatus: { type: string }

    OrderResponse:
      type: object
      properties:
        orderId: { type: string }
        customerId: { type: string }
        orderedAt: { type: string, format: date-time }
        fulfillmentType: { type: string }
        receiverName: { type: string }
        receiverPhone: { type: string }
        deliveryAddress: { type: string }
        customerNote: { type: string }
        subtotal: { type: number }
        discountAmount: { type: number }
        deliveryFee: { type: number }
        totalAmount: { type: number }
        status: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }
        payment:
          type: object
          properties:
            paymentId: { type: string }
            method: { type: string }
            status: { type: string }
            amount: { type: number }
        history:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              changedAt: { type: string, format: date-time }
              note: { type: string }

    OrderItemResponse:
      type: object
      properties:
        foodId: { type: string }
        foodName: { type: string }
        foodNameSnapshot: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
        note: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              optionName: { type: string }
              extraPrice: { type: number }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
